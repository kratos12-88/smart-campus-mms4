name: Smart Campus CI + Kubernetes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

      - name: Start Minikube
        uses: medyagh/setup-minikube@master

      - name: Build application image inside Minikube
        run: |
          eval $(minikube docker-env)
          DOCKER_BUILDKIT=0 docker build -t smart-campus-mms4:ci .

      - name: Create Kubernetes database secret
        run: |
          kubectl create secret generic db-vault \
            --from-literal=mongodb-uri="mongodb://mongo:27017/smart_campus" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy MongoDB and Smart Campus
        run: |
          kubectl apply -f k8s/mongodb.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for workloads
        run: |
          kubectl rollout status deployment/mongo --timeout=180s
          kubectl rollout status deployment/smart-campus --timeout=240s
          kubectl get pods
          kubectl get services

      - name: Verify database-backed API
        run: |
          kubectl port-forward service/smart-campus 18080:80 >/tmp/port-forward.log 2>&1 &
          PF_PID=$!
          trap "kill $PF_PID || true" EXIT
          sleep 8
          curl --fail --retry 8 --retry-delay 3 http://127.0.0.1:18080/api/dashboard/summary
